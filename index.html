<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Masa Berlaku LSPro & Lab Uji | ESDM</title>
  <meta name="description" content="Website monitoring masa berlaku penunjukan Lembaga Sertifikasi Produk (LSPro) dan Laboratorium Uji yang ditetapkan oleh Kementerian ESDM." />
  <meta name="keywords" content="LSPro, Laboratorium Uji, ESDM, masa berlaku, sertifikasi produk, monitoring" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=17" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header-bg"></div>
    <div class="container">
      <div class="header-content">
        <div class="header-logo">
          <div class="logo-icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <rect width="36" height="36" rx="10" fill="url(#logoGrad)"/>
              <path d="M10 18C10 13.58 13.58 10 18 10C22.42 10 26 13.58 26 18C26 22.42 22.42 26 18 26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M18 14V18L21 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="14" cy="24" r="2.5" fill="white"/>
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#33AEC4"/>
                  <stop offset="1" stop-color="#0097B2"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">Monitoring LSPro & Lab Uji</span>
          </div>
        </div>
        <a href="Keputusan_Menteri_ESDM_95KEK07DJE2025.pdf" target="_blank" class="preview-btn" title="Lihat Dokumen Kepmen ESDM">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Preview Kepmen Penunjukan
        </a>
        <nav class="header-nav" aria-label="Navigasi Utama">
          <button class="nav-btn active" id="nav-lspro" onclick="switchTab('lspro')" aria-selected="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            LSPro
          </button>
          <button class="nav-btn" id="nav-labuji" onclick="switchTab('labuji')" aria-selected="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
            Lab Uji
          </button>
        </nav>
        <div class="header-meta">
          <button id="themeToggle" class="theme-toggle-btn" aria-label="Ganti Tema">
            <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="sunIcon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== HERO STATS ===== -->
  <section class="stats-section" aria-label="Statistik Ringkasan">
    <div class="container">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card" id="stat-total" onclick="setStatusFilter('')" role="button" tabindex="0">
          <div class="stat-icon stat-icon--blue">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-content">
            <div class="stat-number" id="statTotal">—</div>
            <div class="stat-label">Total Lembaga</div>
          </div>
        </div>
        <div class="stat-card" id="stat-aktif" onclick="setStatusFilter('aktif')" role="button" tabindex="0">
          <div class="stat-icon stat-icon--green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-content">
            <div class="stat-number" id="statAktif">—</div>
            <div class="stat-label">Masih Berlaku</div>
          </div>
        </div>
        <div class="stat-card" id="stat-segera" onclick="setStatusFilter('segera')" role="button" tabindex="0">
          <div class="stat-icon stat-icon--orange">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <div class="stat-content">
            <div class="stat-number" id="statSegera">—</div>
            <div class="stat-label">Segera Berakhir (≤30 hari)</div>
          </div>
        </div>
        <div class="stat-card" id="stat-kadaluarsa" onclick="setStatusFilter('kadaluarsa')" role="button" tabindex="0">
          <div class="stat-icon stat-icon--red">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div class="stat-content">
            <div class="stat-number" id="statKadaluarsa">—</div>
            <div class="stat-label">Sudah Berakhir</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="mainContent">
    <div class="container">

      <!-- Controls Bar -->
      <div class="controls-bar">
        <div class="search-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="Cari nama lembaga, alamat..." 
            aria-label="Pencarian lembaga"
          />
          <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Hapus pencarian" style="display:none">×</button>
        </div>
        <div class="filter-row">
          <select id="filterKategori" class="filter-select" aria-label="Filter kategori produk" onchange="applyFilters()">
            <option value="">Kategori Peralatan</option>
          </select>
          <select id="filterStatus" class="filter-select" aria-label="Filter status masa berlaku" onchange="applyFilters()">
            <option value="">Semua Status</option>
            <option value="aktif">Masih Berlaku</option>
            <option value="segera">Segera Berakhir (≤30 hari)</option>
            <option value="kadaluarsa">Sudah Berakhir</option>
          </select>
          <button class="btn-reset" id="resetFiltersBtn" onclick="resetFilters()" title="Reset semua filter">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
          </button>
        </div>
        <div class="results-meta">
          <span id="resultsCount" class="results-count">— data ditemukan</span>
          <div class="view-toggle">
            <button class="view-btn active" id="viewGrid" onclick="setView('grid')" aria-label="Tampilan kartu" title="Grid view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </button>
            <button class="view-btn" id="viewList" onclick="setView('list')" aria-label="Tampilan daftar" title="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Data Grid -->
      <div class="data-grid" id="dataGrid" role="list" aria-label="Daftar lembaga">
        <div class="loading-state" id="loadingState">
          <div class="loading-spinner"></div>
          <p>Memuat data...</p>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display:none">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>Tidak ada data ditemukan</h3>
        <p>Coba ubah filter atau kata kunci pencarian</p>
        <button class="btn-primary" onclick="resetFilters()">Reset Filter</button>
      </div>

    </div>
  </main>

  <!-- ===== MODAL DETAIL ===== -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalBox" role="document">
      <button class="modal-close" id="modalCloseBtn" aria-label="Tutup detail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="modal-header">
        <div class="modal-badge" id="modalBadge"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-category" id="modalCategory"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          Monitoring Masa Berlaku Lab Uji dan LSPro
        </div>
        <div class="footer-meta">
          <div class="last-update" id="lastUpdate" style="font-weight: 500; opacity: 0.8;">Memuat data...</div>
        </div>
      </div>
    </div>
  </footer>

  <script src="app.js?v=11"></script>
</body>
</html>
